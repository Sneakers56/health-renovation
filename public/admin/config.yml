# Content editor for Mark. Saving here commits to GitHub; Netlify rebuilds the site in ~1 minute.
# Setup: replace OWNER/REPO below, then in Netlify enable a GitHub OAuth provider
# (Site configuration → Access & security → OAuth).
backend:
  name: github
  repo: Sneakers56/health-renovation
  branch: main

# Lets you test the editor locally: run `npm run cms` next to `npm run dev`.
local_backend: true

media_folder: src/assets/images
public_folder: ../../assets/images

# ── Reusable field definitions ─────────────────────────────────────────────
x-fields:
  enabled: &enabled { name: enabled, label: Show this section, widget: boolean, default: true }
  eyebrow: &eyebrow { name: eyebrow, label: Small label above heading, widget: string, required: false }
  heading: &heading { name: heading, label: Heading, widget: string }
  headingOpt: &headingOpt { name: heading, label: Heading, widget: string, required: false }
  button-fields: &button-fields
    - { name: label, label: Button text, widget: string, required: false }
    - { name: link, label: "Link (e.g. /contact/, tel:0412567614, sms:0412567614, https://…)", widget: string, required: false }
  button1: &button1 { name: button1, label: Button 1, widget: object, required: false, collapsed: true, fields: *button-fields }
  button2: &button2 { name: button2, label: Button 2, widget: object, required: false, collapsed: true, fields: *button-fields }
  button: &button { name: button, label: Button, widget: object, required: false, collapsed: true, fields: *button-fields }
  icons: &icons [pain, digestive, lymphatic, energy, wellbeing, stress, whole, personalised, gentle, informed, kinesiology, homeopathy, massage, mrt-detox, life-coaching, reiki, shield, check, pin, clock, phone, mail, person]
  seo: &seo
    name: seo
    label: Search engine settings
    widget: object
    required: false
    collapsed: true
    fields:
      - { name: title, label: "Page title in Google (leave blank to use the page title)", widget: string, required: false }
      - { name: description, label: "Description in Google (about 150 characters)", widget: text, required: false }
      - { name: noindex, label: Hide this page from search engines, widget: boolean, required: false, default: false }

collections:
  # ── Services ─────────────────────────────────────────────────────────────
  - name: services
    label: Services
    label_singular: Service
    description: Each service gets its own page and appears in the menu, footer, services grid and contact form automatically.
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: order, label: Order on page, widget: number, value_type: int }
      - { name: tagline, label: Tagline, widget: string }
      - { name: excerpt, label: Card summary (homepage), widget: text }
      - { name: duration, label: Session length, widget: string }
      - { name: image, label: Photo, widget: image }
      - { name: benefits, label: Key benefits, widget: list, collapsed: false, field: { name: benefit, label: Benefit, widget: string } }
      - { name: color, label: Card colour, widget: select, options: [green, teal, amber, blue, purple, rose] }
      - { name: icon, label: Icon, widget: select, options: *icons }
      - *seo
      - { name: body, label: Description, widget: markdown }

  # ── Blog ─────────────────────────────────────────────────────────────────
  - name: posts
    label: Blog
    label_singular: Article
    description: Articles appear at /blog/. Add "Blog" to the menu under Settings → Navigation once you've published one.
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} ({{date | date('D MMM YYYY')}})"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Summary (shown on the blog page and in Google)", widget: text }
      - { name: date, label: Publish date, widget: datetime, format: YYYY-MM-DD, date_format: D MMM YYYY, time_format: false }
      - { name: image, label: Main photo, widget: image, required: false }
      - { name: imageAlt, label: Photo description (for accessibility), widget: string, required: false }
      - { name: draft, label: "Draft (not published)", widget: boolean, default: true }
      - { name: body, label: Article, widget: markdown }

  # ── Settings ─────────────────────────────────────────────────────────────
  - name: settings
    label: Settings
    editor: { preview: false }
    files:
      - name: navigation
        label: Navigation menu
        file: src/data/navigation.json
        fields:
          - name: items
            label: Menu links
            label_singular: link
            widget: list
            summary: "{{fields.label}} → {{fields.link}}"
            fields:
              - { name: label, label: Text, widget: string }
              - { name: link, label: "Link (e.g. /about/ or https://…)", widget: string }
              - { name: servicesDropdown, label: Show all services in a dropdown, widget: boolean, required: false, default: false }
              - name: children
                label: Extra dropdown links
                label_singular: dropdown link
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: link, label: Link, widget: string }
          - name: button
            label: Highlighted menu button
            widget: object
            fields: *button-fields

      - name: testimonials
        label: Testimonials
        file: src/data/testimonials.json
        description: "Only add genuine testimonials you have permission to use. Show them on any page with a Testimonials section."
        fields:
          - name: testimonials
            label: Testimonials
            label_singular: testimonial
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: name, label: "Name (e.g. Sarah K.)", widget: string }
              - { name: detail, label: "Detail (e.g. Kinesiology client)", widget: string, required: false }

      - name: site
        label: Business details & site settings
        file: src/data/site.json
        fields:
          - { name: name, label: Business name, widget: string }
          - { name: practitioner, label: Practitioner name, widget: string }
          - { name: tagline, label: Footer tagline, widget: string }
          - { name: phone, label: Phone, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: suburb, label: Suburb, widget: string }
          - { name: state, label: State, widget: string }
          - { name: postcode, label: Postcode, widget: string }
          - { name: locationNote, label: Location note, widget: string }
          - { name: hours, label: Hours (short), widget: string }
          - label: Social links
            name: social
            widget: list
            required: false
            summary: "{{fields.network}}"
            fields:
              - { name: network, label: Network, widget: select, options: [Facebook, Instagram, LinkedIn] }
              - { name: url, label: URL, widget: string }
          - label: Announcement bar (top of every page)
            name: announcement
            widget: object
            collapsed: true
            fields:
              - { name: enabled, label: Show announcement, widget: boolean, default: false }
              - { name: text, label: Text, widget: string, required: false }
              - { name: link, label: Link (optional), widget: string, required: false }
          - { name: googleAnalyticsId, label: "Google Analytics ID (G-XXXXXXX, optional)", widget: string, required: false }
